name: Secret scan
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download and verify Gitleaks
        env:
          GH_TOKEN: ${{ github.token }}
          GITLEAKS_VERSION: v8.30.1
        run: |
          scan_tools="$(mktemp -d)"
          gh release download "$GITLEAKS_VERSION" --repo gitleaks/gitleaks \
            --pattern '*linux_x64.tar.gz' --pattern '*checksums.txt' --dir "$scan_tools"
          cd "$scan_tools"
          sha256sum --check --ignore-missing *checksums.txt
          tar -xzf *linux_x64.tar.gz gitleaks
          echo "$scan_tools" >> "$GITHUB_PATH"
      - name: Scan history for secrets
        run: gitleaks git . --log-opts=--all --redact=100
